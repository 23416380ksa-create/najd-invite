:root{color-scheme:light;--bg:#E9DDCD;--ink:#3A2011;--muted:#6A5040;--surf:#F6EEE4;--field:#FFFaf4;--line:#CFBBA3;--btn:#43240E;--btnInk:#F7EEE3;--focus:#C47F2C;--ok:#2F6B3A;--err:#A33A1F}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1A110B;--ink:#F1E4D3;--muted:#C4AD95;--surf:#26180F;--field:#1E140D;--line:#4B3424;--btn:#E9B15E;--btnInk:#26150A;--focus:#F2B04A;--ok:#8CCB91;--err:#F0957A}}
:root[data-theme=dark]{color-scheme:dark;--bg:#1A110B;--ink:#F1E4D3;--muted:#C4AD95;--surf:#26180F;--field:#1E140D;--line:#4B3424;--btn:#E9B15E;--btnInk:#26150A;--focus:#F2B04A;--ok:#8CCB91;--err:#F0957A}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:28px max(16px,4vw) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:820px){.wrap{grid-template-columns:minmax(0,350px) minmax(0,1fr);column-gap:56px;align-items:start;padding-top:40px}.side{position:sticky;top:32px}}
h1{font:700 clamp(28px,4.2vw,38px)/1.15 "El Messiri","Geeza Pro",sans-serif;margin:0 0 8px;text-wrap:balance}
.lede{margin:0 0 20px;color:var(--muted);max-width:34em}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text]{display:block;width:100%;font:inherit;font-size:18px;line-height:1.4;padding:11px 14px;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.7}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.actions{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.actions.both{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.go{width:100%;min-height:54px;padding:0 12px;border:1.5px solid var(--btn);border-radius:14px;background:var(--btn);color:var(--btnInk);font:600 18px/1 "El Messiri","Geeza Pro",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;transition:filter .15s}
.go.alt{background:transparent;color:var(--ink)}
.go{-webkit-tap-highlight-color:transparent}
.go[hidden]{display:none}
.go:hover{filter:brightness(1.1)}
.go:active{transform:translateY(1px)}
.go[aria-busy=true]{opacity:.7;cursor:progress}
.go svg{width:20px;height:20px;flex:none}
.msg{min-height:26px;margin:10px 2px 0;font-size:15px;color:var(--muted)}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--err)}
.note{font-size:14px;color:var(--muted);margin:14px 4px 0}
.stage{display:flex;justify-content:center}
.card{position:relative;width:min(100%,393px);aspect-ratio:393/852;border-radius:24px;overflow:hidden;background:#F4EBE0;box-shadow:0 0 0 1px rgba(58,32,17,.12),0 14px 30px -18px rgba(58,32,17,.5)}
@media (min-width:820px){.card{width:auto;height:min(852px,calc(100vh - 64px))}}
@supports (height:100svh){@media (min-width:820px){.card{height:min(852px,calc(100svh - 64px))}}}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card a{position:absolute;border-radius:999px}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="wrap">
  <section class="side">
    <h1>دعوات افتتاح مخيم نجد</h1>
    <p class="lede" id="lede">اكتب اسم الضيف لتظهر دعوته باسمه، ثم صدّرها ملف PDF بمقاس شاشة الآيفون.</p>
    <form class="panel" id="f" autocomplete="off">
      <label for="nm">اسم المدعو</label>
      <input type="text" id="nm" placeholder="مثال: الأستاذ محمد بن عبدالله" enterkeyhint="done" maxlength="60">
      <div class="actions" id="actions">
        <button class="go" id="share" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
          <span>مشاركة</span>
        </button>
        <button class="go" id="go" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
          <span id="go-label">تنزيل الدعوة PDF</span>
        </button>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="note">الملف صفحة واحدة بمقاس شاشة الآيفون، وزر «موقع المخيم» داخله يفتح الموقع في خرائط قوقل عند الضغط عليه.</p>
  </section>
  <section class="stage" aria-label="معاينة الدعوة">
    <div class="card">
      <canvas id="cv" role="img" aria-label="الدعوة كما ستظهر في ملف PDF"></canvas>
      <a id="map" href="https://maps.app.goo.gl/XcUkdJtHzbWXGNP5A?g_st=ic" target="_blank" rel="noopener" aria-label="موقع المخيم على خرائط قوقل"></a>
    </div>
  </section>
</main>

<script>

const P1 = 'نتشرّف بدعوتك لحضور أمسية الافتتاح الخاصة لـ';

const WORDS = [...P1.split(' ').map(t => [[t, 'b']]), [['مخيم', 'h']], [['نجد', 'h'], ['،', 'b']], ...P2.split(' ').map(t => [[t, 'b']])];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const nm = $('nm'), go = $('go'), msg = $('msg'), link = $('map');
const WHEN = {d: 'الجمعة 27 نوفمبر', t: '5 مساءً'};
cv.width = W * S; cv.height = H * S;

const logo = new Image();
let logoAR = 489 / 780, logoOK = false, btn = {x: 0, y: 0, w: 0, h: 0}, linkBox = null;

const clean = s => (s || '').replace(/\s+/g, ' ').trim();
const mw = (t, f) => { ctx.font = f; return ctx.measureText(RLM + t + RLM).width; };
const put = (t, x, y, f, c) => { ctx.font = f; ctx.fillStyle = c; ctx.fillText(RLM + t + RLM, x, y); };
const mid = (t, y, f, c) => { const w = mw(t, f); put(t, W / 2 - w / 2, y, f, c); return w; };
const fit = (t, weight, fam, max, min, maxW) => { let s = max; while (s > min && mw(t, `${weight} ${s}px ${fam}`) > maxW) s -= .5; return s; };

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function diamond(x, y, s, c) {
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath();
  ctx.fillStyle = c; ctx.fill();
}
function rule(x1, x2, y, c, w) { ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }

let paperG;
function paper() {
  paperG = ctx.createLinearGradient(0, 0, 0, H);
  paperG.addColorStop(0, C.top); paperG.addColorStop(1, C.bot);
  ctx.fillStyle = paperG; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, 60, 0, W / 2, 60, 330);
  g.addColorStop(0, 'rgba(242,176,74,.24)'); g.addColorStop(1, 'rgba(242,176,74,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function horizon() {
  const gy = 808;
  const ridge = [[50, gy], [166, 757], [224, 787], [266, 771], [344, gy]];
  const sg = ctx.createLinearGradient(0, 752, 0, 790);
  sg.addColorStop(0, '#C98A35'); sg.addColorStop(1, '#8E5420');
  ctx.beginPath(); ctx.arc(219, 772, 18, 0, Math.PI * 2);
  ctx.strokeStyle = sg; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ridge.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = paperG; ctx.fill();
  ctx.beginPath(); ridge.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = 'rgba(67,36,14,.85)'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round'; ctx.stroke();
  const gl = ctx.createLinearGradient(30, 0, W - 30, 0);
  gl.addColorStop(0, 'rgba(67,36,14,0)'); gl.addColorStop(.18, 'rgba(67,36,14,.7)');
  gl.addColorStop(.82, 'rgba(67,36,14,.7)'); gl.addColorStop(1, 'rgba(67,36,14,0)');
  rule(30, W - 30, gy, gl, 1.1);
  ctx.beginPath(); ctx.moveTo(70, gy + 12); ctx.quadraticCurveTo(W / 2, gy + 4, W - 70, gy + 12);
  ctx.strokeStyle = 'rgba(169,101,31,.35)'; ctx.lineWidth = .8; ctx.stroke();
}

function lights() {
  const x0 = 34, x1 = W - 34, y0 = 34, sag = 30, n = 9;
  const yAt = x => { const t = (x - W / 2) / ((x1 - x0) / 2); return y0 + sag * (1 - t * t); };
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let x = x0; x <= x1; x += 3) ctx.lineTo(x, yAt(x));
  ctx.lineTo(x1, y0); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.1; ctx.stroke();
  [x0, x1].forEach(x => { ctx.beginPath(); ctx.arc(x, y0, 2.3, 0, Math.PI * 2); ctx.fillStyle = C.ink; ctx.fill(); });
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * (i + .5) / n, y = yAt(x), by = y + 13;
    const g = ctx.createRadialGradient(x, by, 0, x, by, 18);
    g.addColorStop(0, 'rgba(242,176,74,.55)'); g.addColorStop(1, 'rgba(242,176,74,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 19, by - 19, 38, 38);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 5); ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = C.ink; ctx.fillRect(x - 2.3, y + 5, 4.6, 3.2);
    const b = ctx.createRadialGradient(x - 1, by - 1.6, .4, x, by, 5.2);
    b.addColorStop(0, '#FFE6AE'); b.addColorStop(1, C.glow);
    ctx.beginPath(); ctx.ellipse(x, by, 3.7, 4.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = b; ctx.fill(); ctx.lineWidth = .9; ctx.strokeStyle = C.ink; ctx.stroke();
  }
}

function border() {
  ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(67,36,14,.5)'; rr(14, 14, W - 28, H - 28, 22); ctx.stroke();
  ctx.lineWidth = .7; ctx.strokeStyle = 'rgba(169,101,31,.55)'; rr(19.5, 19.5, W - 39, H - 39, 17); ctx.stroke();
  [[14, H / 2], [W - 14, H / 2]].forEach(([x, y]) => { diamond(x, y, 4, C.top); ctx.lineWidth = .9; ctx.strokeStyle = 'rgba(67,36,14,.6)'; ctx.stroke(); });
}

function pin(cx, cy, s, fill, hole) {
  ctx.beginPath(); ctx.moveTo(cx, cy + s * .58);
  ctx.bezierCurveTo(cx - s * .5, cy + s * .02, cx - s * .44, cy - s * .52, cx, cy - s * .52);
  ctx.bezierCurveTo(cx + s * .44, cy - s * .52, cx + s * .5, cy + s * .02, cx, cy + s * .58);
  ctx.fillStyle = fill; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy - s * .14, s * .16, 0, Math.PI * 2); ctx.fillStyle = hole; ctx.fill();
}

function wrapPara() {
  const sp = mw(' ', F.b);
  const wrap = maxW => {
    const L = []; let cur = [], cw = 0;
    for (const parts of WORDS) {
      const ww = parts.reduce((s, [t, k]) => s + mw(t, F[k]), 0);
      if (cur.length && cw + sp + ww > maxW) { L.push({ws: cur, w: cw}); cur = []; cw = 0; }
      cw += (cur.length ? sp : 0) + ww; cur.push({parts, w: ww});
    }
    if (cur.length) L.push({ws: cur, w: cw});
    return L;
  };
  let lines = wrap(306); const n = lines.length;
  for (let m = 302; m >= 220; m -= 4) { const t = wrap(m); if (t.length > n) break; lines = t; }
  return {lines, sp};
}
function drawLine(line, y, sp) {
  let x = W / 2 + line.w / 2;
  for (const w of line.ws) {
    for (const [t, k] of w.parts) { const pw = mw(t, F[k]); x -= pw; put(t, x, y, F[k], COL[k]); }
    x -= sp;
  }
}

function render() {
  const name = clean(nm.value), d = WHEN.d, t = WHEN.t;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.clearRect(0, 0, W, H);
  paper(); horizon(); lights(); border();

  const {lines, sp} = wrapPara();
  const LH = 30, hasDT = !!(d || t);
  const items = [['title', 40], ['g', 2], ['sub', 26], ['g', 14], ['div', 12], ['g', 20], ['name', 44], ['g', 16],
    ['para', lines.length * LH], ['g', 22], ...(hasDT ? [['dt', 44], ['g', 20]] : []), ['btn', 52], ['g', 8], ['hint', 16]];
  const fixed = items.filter(i => i[0] !== 'g').reduce((s, i) => s + i[1], 0);
  const gaps = items.filter(i => i[0] === 'g').reduce((s, i) => s + i[1], 0);
  const LY = 86, BOTTOM = 742;
  const avail = L => BOTTOM - (LY + L * logoAR + 12);
  let L = 250, g = 1;
  while (fixed + gaps > avail(L) && L > 180) L -= 5;
  if (fixed + gaps > avail(L)) g = Math.max(.5, (avail(L) - fixed) / gaps);
  let slack = avail(L) - fixed - gaps * g;
  if (slack > 0) { const extra = Math.min(slack, gaps * .35); g += extra / gaps; slack -= extra; }
  if (logoOK) ctx.drawImage(logo, (W - L) / 2, LY, L, L * logoAR);
  let y = LY + L * logoAR + 12 + Math.max(0, slack) / 2;

  for (const [k, h] of items) {
    if (k === 'g') { y += h * g; continue; }
    if (k === 'title') {
      const f = `700 34px ${DISP}`, w = mid('دعــوة خـاصـة', y + 32, f, C.amber), oy = y + 21;
      for (const dir of [1, -1]) {
        const a = W / 2 + dir * (w / 2 + 12), b = a + dir * 26;
        rule(a, b, oy, 'rgba(169,101,31,.7)', .9); diamond(b + dir * 5, oy, 3, C.amber);
      }
    } else if (k === 'sub') {
      mid('افتتاح مخيم نجد', y + 20, `500 18px ${DISP}`, C.ink);
    } else if (k === 'div') {
      const cy = y + 6;
      rule(W / 2 + 12, W / 2 + 78, cy, 'rgba(67,36,14,.45)', .8); rule(W / 2 - 78, W / 2 - 12, cy, 'rgba(67,36,14,.45)', .8);
      diamond(W / 2, cy, 4, C.amber); diamond(W / 2 + 84, cy, 1.6, C.ink); diamond(W / 2 - 84, cy, 1.6, C.ink);
    } else if (k === 'name') {
      if (name) {
        const s = fit(name, 700, DISP, 32, 17, 304);
        mid(name, y + 22 + s * .38, `700 ${s}px ${DISP}`, C.ink);
      } else {
        const w = mid('اسم المدعو', y + 34, `700 30px ${DISP}`, C.faint);
        ctx.setLineDash([4, 4]); rule(W / 2 - w / 2 - 10, W / 2 + w / 2 + 10, y + 44, C.faint, 1); ctx.setLineDash([]);
      }
    } else if (k === 'para') {
      lines.forEach((ln, i) => drawLine(ln, y + i * LH + 21, sp));
    } else if (k === 'dt') {
      const cells = [['التاريخ', d], ['الوقت', t]].filter(c => c[1]);
      const xs = cells.length === 2 ? [W / 2 + 76, W / 2 - 76] : [W / 2];
      cells.forEach(([lab, val], i) => {
        const x = xs[i];
        const lw = mw(lab, `400 12.5px ${PLEX}`); put(lab, x - lw / 2, y + 14, `400 12.5px ${PLEX}`, C.muted);
        const s = fit(val, 600, DISP, 16.5, 11, 138), vw = mw(val, `600 ${s}px ${DISP}`);
        put(val, x - vw / 2, y + 37, `600 ${s}px ${DISP}`, C.ink);
      });
      if (cells.length === 2) {
        ctx.beginPath(); ctx.moveTo(W / 2, y + 4); ctx.lineTo(W / 2, y + 42);
        ctx.strokeStyle = 'rgba(169,101,31,.6)'; ctx.lineWidth = .8; ctx.stroke();
      }
    } else if (k === 'btn') {
      const bw = 236, bh = 52, bx = (W - bw) / 2;
      btn = {x: bx, y, w: bw, h: bh};
      rr(bx, y, bw, bh, bh / 2); ctx.fillStyle = C.ink; ctx.fill();
      rr(bx + 3.5, y + 3.5, bw - 7, bh - 7, (bh - 7) / 2); ctx.strokeStyle = 'rgba(242,176,74,.55)'; ctx.lineWidth = .8; ctx.stroke();
      const f = `600 18px ${DISP}`, tw = mw('موقع المخيم', f), total = tw + 10 + 15, right = W / 2 + total / 2;
      pin(right - 7.5, y + 25, 17, C.glow, C.ink);
      put('موقع المخيم', right - 15 - 10 - tw, y + 32, f, C.btnInk);
    } else if (k === 'hint') {
      mid('اضغط على الزر لفتح الموقع في خرائط قوقل', y + 12, `400 12.5px ${PLEX}`, C.muted);
      linkBox = {x: btn.x - 8, y: btn.y - 6, w: btn.w + 16, h: (y + 16) - btn.y + 10};
    }
    y += h;
  }
  const b = linkBox;
  Object.assign(link.style, {left: b.x / W * 100 + '%', top: b.y / H * 100 + '%', width: b.w / W * 100 + '%', height: b.h / H * 100 + '%'});
  built = null;
  schedulePrebuild();
}
const queue = () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(render); };

function buildPdf() {
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'pt', format: [W, H], orientation: 'portrait', compress: true});
  pdf.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  pdf.link(linkBox.x, linkBox.y, linkBox.w, linkBox.h, {url: MAP});
  pdf.setProperties({title: 'Najd Camp - Opening Invitation', creator: 'Najd Camp'});
  return pdf.output('blob');
}
const keyNow = () => clean(nm.value);
const touch = () => window.matchMedia && matchMedia('(pointer: coarse)').matches;
function schedulePrebuild() {
  clearTimeout(preT);
  if (!clean(nm.value) || dl || !window.jspdf || !touch()) return;
  preT = setTimeout(() => { try { built = {key: keyNow(), blob: buildPdf()}; } catch (e) { built = null; } }, 700);
}

function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
const fileName = name => `دعوة مخيم نجد - ${name.replace(/[\\/:*?"<>|]+/g, ' ').trim()}.pdf`;

const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const dlReady = (async () => {
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
})();

async function exportPdf(mode) {
  const name = clean(nm.value);
  if (!name) { say('اكتب اسم المدعو أولاً.', 'err'); nm.focus(); return; }
  if (!window.jspdf) { say('تعذّر تحميل أداة إنشاء PDF. أعد تحميل الصفحة ثم حاول مرة أخرى.', 'err'); return; }
  const btnEl = mode === 'share' ? shareBtn : go;
  btnEl.setAttribute('aria-busy', 'true'); say('جارٍ تجهيز الملف…');
  if (window.claude && window.claude.use && !dl) await dlReady;
  const file = fileName(name);
  let fellBack = false;
  try {
    if (!dl && framed) {
      say('عرض Claude في سفاري لا يسمح بحفظ الملف أو مشاركته. افتح الرابط من تطبيق Claude على الآيفون لتظهر لك قائمة المشاركة.', 'err');
      return;
    }
    const blob = built && built.key === keyNow() ? built.blob : buildPdf();
    if (dl) {
      try {
        const r = await dl.save({filename: file, data: blob});
        say(r && r.status === 'delivered' ? 'تم إرسال الملف.' : `جاهزة: دعوة ${name}.`, 'ok');
      } catch (e) {
        const c = e && e.code;
        say(c === 'declined' ? 'تم إلغاء الحفظ.' : c === 'rate_limited' ? 'هناك نافذة حفظ مفتوحة، أكملها ثم حاول مرة أخرى.' :
          c === 'host_unavailable' ? 'هذا التطبيق لا يحفظ الملفات. افتح الصفحة في المتصفح لحفظها.' : 'تعذّر الحفظ هنا، حاول مرة أخرى.', c === 'declined' ? '' : 'err');
      }
      return;
    }
    if (mode === 'share') {
      const f = new File([blob], file, {type: 'application/pdf'});
      if (navigator.canShare && navigator.canShare({files: [f]})) {
        try { await navigator.share({files: [f]}); say(`تمت مشاركة دعوة ${name}.`, 'ok'); return; }
        catch (e) { if (e && e.name === 'AbortError') { say('تم إلغاء المشاركة.'); return; } }
      }
      fellBack = true;
    }
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = file; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
    say(fellBack ? 'المشاركة غير مدعومة هنا، فنزّلت الملف. افتحه من التنزيلات واضغط مشاركة لإرساله على واتساب.' : `تم تنزيل دعوة ${name}.`, 'ok');
  } catch (e) {
    say('حدث خطأ أثناء إنشاء الملف، حاول مرة أخرى.', 'err');
  } finally { btnEl.removeAttribute('aria-busy'); }
}

const shareBtn = $('share');
if (touch()) {
  shareBtn.hidden = false;
  $('actions').classList.add('both');
  $('go-label').textContent = 'تنزيل PDF';
  go.classList.add('alt');
  $('lede').textContent = 'اكتب اسم الضيف لتظهر دعوته باسمه، ثم شاركها على واتساب أو نزّلها ملف PDF.';
}
nm.addEventListener('input', () => { say(''); queue(); });
$('f').addEventListener('submit', e => { e.preventDefault(); document.activeElement && document.activeElement.blur(); });
go.addEventListener('click', () => exportPdf('download'));
shareBtn.addEventListener('click', () => exportPdf('share'));

logo.onload = () => { logoOK = true; logoAR = logo.naturalHeight / logo.naturalWidth; queue(); };
logo.src = window.NAJD_LOGO || '';
render();
if (document.fonts) {
  const sample = 'دعوة مخيم نجد حضرة 0123';
  Promise.all([`700 34px ${DISP}`, `600 18px ${DISP}`, `500 18px ${DISP}`, `400 16px ${PLEX}`].map(f => document.fonts.load(f, sample)))
    .catch(() => {}).then(queue);
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', queue);
}
}
</script>
</body>
